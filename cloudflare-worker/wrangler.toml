# Wrangler config for the `glucose-relay` Worker (glucose-relay.djtwo6.workers.dev).
#
# This enables `wrangler deploy` — used by .github/workflows/deploy-worker.yml
# to auto-deploy on every push that touches cloudflare-worker/**, replacing the
# old "paste into the Cloudflare dashboard Quick Edit UI" manual step.
#
# Secrets (API_SECRET, API_SECRET_V2, ALLOWED_EMAILS, ANTHROPIC_API_KEY) are
# NOT declared here — they're set on the live Worker via the dashboard/
# `wrangler secret put`, live server-side.
#
# THIS ONLY WORKS IF THEIR TYPE IS ACTUALLY "Secret", NOT "Variable" —
# wrangler treats wrangler.toml as the complete, authoritative config for
# everything except true secrets, so an undeclared plain Variable gets
# silently deleted on deploy, same as an undeclared binding. This already
# happened once: ALLOWED_EMAILS was a plain Variable and the first
# automated deploy wiped it, breaking every Firebase-gated dashboard
# endpoint. If you ever hand-edit a var on the live Worker, check its
# type in Settings -> Variables and Secrets before the next deploy.

name = "glucose-relay"
main = "worker.js"
compatibility_date = "2026-01-01"

[[kv_namespaces]]
binding = "GLUCOSE_KV"
id = "ecca8944f9a348d99c1c94961ee4971d"

# D1 database (WEIGHT_DB -> "weight-data"). worker.js in this repo doesn't
# currently reference this binding, but it's connected on the live Worker —
# declared here so an automated `wrangler deploy` doesn't silently drop it.
[[d1_databases]]
binding = "WEIGHT_DB"
database_name = "weight-data"
database_id = "e195f999-d75f-48e8-8bff-46a1543e39c5"
