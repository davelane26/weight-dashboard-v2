name: Garmin Backfill

on:
  workflow_dispatch:  # Manual trigger only
    inputs:
      days:
        description: 'Number of days to backfill'
        required: true
        default: '30'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r garmin_sync/requirements.txt

      - name: Backfill Garmin data
        working-directory: garmin_sync
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_SESSION: ${{ secrets.GARMIN_SESSION }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WORKER_URL: https://glucose-relay.djtwo6.workers.dev
          API_SECRET: ${{ secrets.API_SECRET }}
          API_SECRET_V2: ${{ secrets.API_SECRET_V2 }}
          WORKER_API_SECRET: ${{ secrets.API_SECRET }}
          FIREBASE_URL: ${{ secrets.FIREBASE_URL }}
        run: python sync_garmin.py --days ${{ inputs.days }}

