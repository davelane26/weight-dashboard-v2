name: Sync Garmin Health Data

on:
  schedule:
    # 1:30 AM, 7:30 AM (morning wake), and 1:30 PM CST
    - cron: '30 7,13,19 * * *'
  workflow_dispatch:         # manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r garmin_sync/requirements.txt

      - name: Fetch Garmin data → Worker
        env:
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GARMIN_SESSION: ${{ secrets.GARMIN_SESSION }}
          GARMIN_EMAIL: ${{ secrets.GARMIN_EMAIL }}
          GARMIN_PASSWORD: ${{ secrets.GARMIN_PASSWORD }}
          WORKER_URL: https://glucose-relay.djtwo6.workers.dev
          API_SECRET: ${{ secrets.API_SECRET }}
          API_SECRET_V2: ${{ secrets.API_SECRET_V2 }}
          WORKER_API_SECRET: ${{ secrets.API_SECRET }}
          SYNC_DAYS: '3'
        run: python fetch_garmin.py

