name: Android Build

on:
  push:
    paths:
      - 'android/**'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:  # allows manual trigger from GitHub UI

# Concurrency: cancel in-flight builds if new push arrives — save Actions minutes.
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Reuse the same debug keystore across builds so signature stays
      # stable and the app installs as an UPDATE instead of throwing
      # "package conflicts with existing package" (Android refuses to
      # replace an app when the signing cert changes).
      - name: Cache debug keystore
        id: cache-keystore
        uses: actions/cache@v4
        with:
          path: android/app/debug.keystore
          key: kage-debug-keystore-v1

      - name: Generate keystore if cache miss
        if: steps.cache-keystore.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore android/app/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Kage Debug, O=davelane26, C=US"

      - name: Build debug APK
        # We build DEBUG (not release) because debug builds use Android's
        # auto-generated debug keystore — no need to manage signing keys
        # in GitHub secrets for a personal side-loaded app. If we ever move
        # to Play Store, switch to assembleRelease + upload-signed-apk here.
        working-directory: android
        run: |
          echo "=== Keystore SHA (should be identical across builds) ==="
          sha256sum app/debug.keystore || shasum -a 256 app/debug.keystore
          gradle assembleDebug --no-daemon --stacktrace
          echo "=== APK signing cert fingerprint (should match previous builds) ==="
          keytool -printcert -jarfile app/build/outputs/apk/debug/app-debug.apk | grep -E 'SHA(1|256)'

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kage-health-bridge-debug
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
