name: Sync Google Health Data

on:
  schedule:
    # 7:00 AM CST (13:00 UTC) every morning after sleep has completed
    - cron: '0 13 * * *'
  workflow_dispatch: # Allow manual trigger anytime from Actions UI

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Fetch Google Health data & patch Worker
        env:
          GOOGLE_HEALTH_CLIENT_ID: ${{ secrets.GOOGLE_HEALTH_CLIENT_ID }}
          GOOGLE_HEALTH_CLIENT_SECRET: ${{ secrets.GOOGLE_HEALTH_CLIENT_SECRET }}
          GOOGLE_HEALTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_HEALTH_REFRESH_TOKEN }}
          API_SECRET_V2: ${{ secrets.API_SECRET_V2 }}
          WORKER_URL: https://glucose-relay.djtwo6.workers.dev
        run: python fetch_google_health.py
